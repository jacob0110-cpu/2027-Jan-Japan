<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東北雪國 JR PASS 7天6夜｜日式精品行程手冊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#1c1b19;
  --ink-soft:#4a4742;
  --mute:#7d7870;
  --paper:rgba(250,248,245,.96);
  --card:#ffffff;
  --sand:#f3efe9;
  --line:#e5dfd5;
  --gold:#9a7b4f;
  --gold-soft:#f6f1e8;
  --terracotta:#a64b35;
  --terracotta-soft:#fbf1ee;
  --sage:#2f634d;
  --sage-soft:#edf4f0;
  --font-sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-serif:"Noto Serif TC","Cormorant Garamond",Georgia,serif;
  --font-en:"Cormorant Garamond","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-sans);
  font-size:14.5px;
  line-height:1.68;
  font-weight:400;
  color:var(--ink);
  overflow:hidden;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:var(--font-sans);letter-spacing:.02em}
#map{position:fixed;inset:0;background:#eae6df}

/* 主側邊面板：極簡和風精品質感 */
.panel{
  position:fixed;z-index:500;left:20px;top:20px;bottom:20px;
  width:min(510px,calc(100vw - 40px));
  display:flex;flex-direction:column;
  background:var(--paper);
  backdrop-filter:blur(16px) saturate(1.15);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(229,223,213,.95);
  border-radius:12px;
  box-shadow:0 18px 48px rgba(28,27,25,.14);
  overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.panel.hide{transform:translateX(calc(-100% - 28px))}

header{
  padding:22px 24px 14px;
  position:relative;
  background:linear-gradient(180deg,#ffffff 0%,rgba(250,248,245,0) 100%);
}
.eyebrow{
  font-family:var(--font-en);
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:4px;
  display:block;
}
.hdr-tools{position:absolute;right:18px;top:20px;display:flex;gap:6px}
h1{
  font-family:var(--font-serif);
  font-weight:700;
  font-size:22px;
  line-height:1.3;
  margin:0 0 6px;
  letter-spacing:.05em;
  padding-right:135px;
  color:var(--ink);
}
.meta{
  color:var(--mute);
  font-size:12.5px;
  display:flex;
  flex-wrap:wrap;
  gap:4px 16px;
}

/* 精品底線式分頁導覽 */
.tabs{
  display:flex;gap:2px;
  padding:0 18px;
  overflow-x:auto;scrollbar-width:none;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.65);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;
  border:0;
  border-bottom:2px solid transparent;
  background:transparent;
  color:var(--mute);
  padding:10px 12px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:color .2s,border-color .2s;
}
.tab small{font-size:11.5px;color:var(--mute);margin-left:4px;font-weight:400}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{
  color:var(--ink);
  font-weight:700;
  border-bottom-color:var(--c,var(--gold));
}
.tab[aria-selected=true] small{color:var(--ink-soft)}
.tab:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px}

.body{flex:1;overflow-y:auto;padding:18px 22px 32px;scroll-behavior:smooth}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:#d6cfc4;border-radius:99px}

/* 每日標題與標籤 */
.dhead{
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  padding-bottom:12px;margin-bottom:14px;
  border-bottom:1px solid var(--line);
}
.dhead h2{
  font-family:var(--font-serif);
  font-weight:700;
  font-size:19px;
  line-height:1.4;
  margin:0;
  letter-spacing:.03em;
}
.dhead .sub{
  display:block;
  font-family:var(--font-sans);
  font-weight:400;
  font-size:13.5px;
  color:var(--ink-soft);
  margin-top:3px;
}
.badge{
  display:inline-flex;align-items:center;
  font-size:11.5px;font-weight:500;
  padding:2px 9px;border-radius:4px;
  background:var(--sand);color:var(--ink-soft);
  border:1px solid var(--line);
  white-space:nowrap;
}
.badge.pay{background:var(--terracotta-soft);color:var(--terracotta);border-color:#ebd0c8}
.badge.jr{background:var(--sage-soft);color:var(--sage);border-color:#c8dfd3}
.badge.custom{background:var(--gold-soft);color:var(--gold);border-color:#e2d4be}
.badge.food{background:#fbf5e8;color:#855c24;border-color:#ead9b7}

/* 行前必做預約提醒卡片 */
.prep-card{
  background:var(--terracotta-soft);
  border:1px solid #ebd0c8;
  border-left:3.5px solid var(--terracotta);
  border-radius:8px;
  padding:12px 14px;
  margin:0 0 14px;
  font-size:13px;
}
.prep-card h4{
  font-family:var(--font-serif);
  margin:0 0 8px;
  font-size:14.5px;
  color:#6e2919;
  display:flex;align-items:center;gap:6px;
}
.prep-list{display:flex;flex-direction:column;gap:6px}
.prep-item{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.82);border:1px solid #f0dcd6;border-radius:6px;padding:6px 9px}
.prep-item input[type=checkbox]{margin-top:3px;accent-color:var(--terracotta);width:15px;height:15px;cursor:pointer;flex:none}
.prep-item.checked span{text-decoration:line-through;color:var(--mute)}
.prep-item span{font-size:12.5px;color:var(--ink);line-height:1.55}

/* 即時氣候卡片 */
.wx{
  background:var(--card);
  border:1px solid var(--line);
  border-left:3px solid var(--gold);
  border-radius:8px;
  padding:11px 14px;
  margin:0 0 14px;
  font-size:13px;
}
.wx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wx-main{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--ink)}
.wx-tag{font-size:11px;padding:1px 8px;border-radius:4px;background:var(--gold-soft);border:1px solid #e2d4be;color:var(--gold)}
.wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.wx-cell{background:var(--sand);border-radius:6px;padding:6px 9px}
.wx-cell small{display:block;color:var(--mute);font-size:11px}
.wx-cell b{font-size:12.5px;font-weight:700;color:var(--ink)}
.wx-tip{margin-top:8px;color:var(--ink-soft);font-size:12.5px}

/* 預算統計儀表板 */
.budget-card{
  background:var(--card);
  border:1px solid var(--line);
  border-top:3px solid var(--ink);
  border-radius:8px;
  padding:14px 16px;
  margin:0 0 16px;
  font-size:13.5px;
}
.budget-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.budget-total{font-family:var(--font-serif);font-size:21px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.budget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.b-cell{background:var(--sand);border-radius:6px;padding:7px 9px}
.b-cell small{display:block;font-size:11px;color:var(--mute)}
.b-cell b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.budget-details summary{cursor:pointer;font-size:12.5px;font-weight:500;color:var(--gold);margin-top:6px}
.budget-edit-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.b-edit-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.b-edit-row label{flex:1;color:var(--ink-soft)}
.b-edit-row input{width:105px;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12.5px;text-align:right;background:var(--paper);color:var(--ink)}

/* 伴手禮與美食卡片 */
.food-box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 14px;
  margin:0 0 12px;
  font-size:13.5px;
}
.food-box summary{cursor:pointer;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between}
.food-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.food-item{display:flex;align-items:flex-start;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.food-item input[type=checkbox]{margin-top:3px;accent-color:var(--gold);width:15px;height:15px;cursor:pointer;flex:none}
.food-item.checked b{text-decoration:line-through;color:var(--mute)}
.food-item div{flex:1;min-width:0}
.food-item b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.food-item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.food-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.food-link{
  display:inline-flex;align-items:center;gap:3px;
  font-size:11.5px;padding:2px 8px;border-radius:4px;
  background:#fff;border:1px solid var(--line);color:var(--gold);
  text-decoration:none;font-weight:500;transition:all .2s;
}
.food-link:hover{border-color:var(--gold);background:var(--gold-soft)}

/* 住宿卡片 */
.hc{
  background:var(--gold-soft);
  border:1px solid #e2d4be;
  border-radius:8px;
  padding:10px 14px;
  margin:0 0 12px;
  font-size:13.5px;
}
.hc summary{cursor:pointer;font-weight:500;color:var(--ink)}.hc dl{display:grid;grid-template-columns:5em 1fr;gap:5px 10px;margin:10px 0 8px}.hc dt{color:var(--mute);font-size:12.5px}.hc dd{margin:0;word-break:break-word;font-size:13px}
.hc a{color:var(--gold);text-decoration:none}

/* 臨時增加行程區塊 */
.addbox{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 14px;
  margin:0 0 14px;
  font-size:13.5px;
}
.addbox summary{cursor:pointer;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between}
.preset-group{margin-top:10px}
.preset-label{font-size:12px;font-weight:500;color:var(--mute);margin-bottom:6px;display:block}
.preset-list{display:flex;flex-direction:column;gap:6px}
.preset-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.preset-item div{flex:1;min-width:0}
.preset-item b{display:block;font-size:13px;font-weight:700}
.preset-item span{display:block;font-size:12px;color:var(--mute)}
.custom-form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:88px 1fr 92px;gap:6px}
.custom-form input{border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13px;background:#fff;width:100%;color:var(--ink)}
.custom-form .full{grid-column:1/-1;display:flex;gap:6px}

/* 按鈕系統統一 */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:5px;
  padding:5px 12px;
  font-size:12.5px;
  font-weight:500;
  text-decoration:none;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  transition:all .2s;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.main:hover{background:#33312e;border-color:#33312e;color:#fff}
.btn.add{background:var(--gold-soft);border-color:#d8c4a6;color:var(--gold);white-space:nowrap}
.btn.add:hover{background:#ede2d0}
.btn.del{color:var(--terracotta);border-color:#ebd0c8;background:var(--terracotta-soft)}
.btn.del:hover{background:#f6e2dc}

/* 時間軸 */
ol.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:1.5px solid var(--c,var(--gold))}
.st{position:relative;padding:0 0 18px 18px}
.st::before{content:"";position:absolute;left:-21.5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--c,var(--gold))}
.st.done::before{background:var(--c,var(--gold))}
.st.done .tt{text-decoration:line-through;color:var(--mute)}
.st.is-extra{background:var(--gold-soft);border:1px solid #e2d4be;border-radius:8px;padding:10px 12px 12px 18px;margin-bottom:12px}
.time{font-family:var(--font-en);font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tt{font-family:var(--font-serif);font-weight:700;font-size:15.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;color:var(--ink);margin-top:1px}
.desc{color:var(--ink-soft);font-size:13.5px;margin:4px 0}
.warn{font-size:12.5px;background:var(--terracotta-soft);border-left:2.5px solid var(--terracotta);color:#7a3221;padding:6px 10px;border-radius:0 5px 5px 0;margin:6px 0}
.opt{font-size:12.5px;background:var(--sage-soft);border-left:2.5px solid var(--sage);padding:5px 10px;border-radius:0 5px 5px 0;margin:6px 0;color:#234b3a}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row .btn{padding:3px 9px;font-size:12px}
.cost-pill{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;color:var(--ink-soft)}
.cost-pill input{width:64px;border:0;background:transparent;font-size:12px;font-weight:700;color:var(--sage);text-align:right;font-variant-numeric:tabular-nums}
.cost-pill input:focus{outline:none;background:var(--sand)}

/* 總覽列表卡片 */
.card{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;gap:14px;align-items:center;
  width:100%;text-align:left;color:inherit;
  transition:all .2s;
}
.card:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 4px 14px rgba(28,27,25,.06)}
.dot{
  flex:none;width:36px;height:36px;border-radius:50%;
  background:var(--c,var(--ink));color:#fff;
  display:grid;place-items:center;
  font-family:var(--font-en);font-weight:700;font-size:14px;
}
.card b{display:block;font-family:var(--font-serif);font-size:14.5px;font-weight:700;color:var(--ink)}
.card span{color:var(--mute);font-size:12.5px;display:block;margin-top:2px}

h3{
  font-family:var(--font-serif);
  font-weight:700;
  font-size:15.5px;
  letter-spacing:.05em;
  margin:24px 0 10px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
  color:var(--ink);
}
ul.p{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-soft)}
ul.p li{margin-bottom:6px}
.links{display:flex;gap:8px;flex-wrap:wrap}

.fab{
  position:fixed;z-index:600;left:20px;top:20px;display:none;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  border-radius:6px;padding:9px 16px;font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(28,27,25,.25);cursor:pointer;
}
.panel.hide~.fab{display:block}

/* 地圖圖釘 */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.pin i{transform:rotate(45deg);font-family:var(--font-sans);font-weight:700;font-size:11.5px;line-height:1;color:#fff;font-style:normal}
.pin.h{background:var(--gold)}
.pin.ex{background:var(--terracotta)}
.leaflet-control-layers{border-radius:8px!important;border:1px solid var(--line)!important;box-shadow:0 4px 16px rgba(28,27,25,.12)!important;font-family:var(--font-sans)!important}
.leaflet-popup-content{font-family:var(--font-sans);font-size:13.5px;line-height:1.55;margin:10px 14px;color:var(--ink)}

/* ---- 預覽列印覆蓋層樣式 ---- */
.print-overlay{position:fixed;inset:0;z-index:900;background:#e8e3da;overflow-y:auto;display:none;padding:68px 16px 40px}
.print-overlay.open{display:block}
.print-bar{position:fixed;top:0;left:0;right:0;z-index:910;background:var(--ink);color:#fff;padding:10px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.print-bar-title{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;letter-spacing:.03em}
.print-bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.print-sheet{max-width:820px;margin:0 auto;background:#fff;border-radius:6px;padding:36px 42px;box-shadow:0 12px 36px rgba(28,27,25,.12);color:var(--ink)}
.ps-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ps-head h2{font-family:var(--font-serif);font-weight:700;font-size:24px;line-height:1.25;margin:0;letter-spacing:.04em}
.ps-meta{font-size:12.5px;color:var(--mute);margin-top:4px}
.ps-summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.ps-box{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--paper)}
.ps-box h4{font-family:var(--font-serif);margin:0 0 8px;font-size:14px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px}
.ps-box ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-soft)}
.ps-box li{margin-bottom:4px}
.ps-prep{border:1px solid #ebd0c8;background:var(--terracotta-soft);border-radius:6px;padding:10px 14px;margin-bottom:22px;font-size:12.5px;color:#5e2214}
.ps-prep h4{font-family:var(--font-serif);margin:0 0 6px;font-size:13.5px;color:var(--terracotta)}
.ps-prep ul{margin:0;padding-left:18px}
.ps-prep li{margin-bottom:3px}
.ps-day{margin-bottom:26px;break-inside:avoid}
.ps-day-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:5px;background:var(--sand);border-left:4px solid var(--c,var(--gold));margin-bottom:10px}
.ps-day-hdr h3{font-family:var(--font-serif);margin:0;font-weight:700;font-size:16px;line-height:1.3;border:0;padding:0}
.ps-wx{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 10px;margin-bottom:8px}
.ps-hotel{font-size:12.5px;background:var(--gold-soft);border:1px solid #e2d4be;border-radius:5px;padding:7px 11px;margin-bottom:8px}
.ps-food{font-size:12.5px;background:#fbf8f1;border:1px solid #ead9b7;border-radius:5px;padding:6px 10px;margin-bottom:10px;color:#5c4524}
.ps-table{width:100%;border-collapse:collapse;font-size:13px}
.ps-table th,.ps-table td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.ps-table th{background:var(--sand);font-weight:700;color:var(--ink-soft);font-size:12px}

  ['入住 / 退房',`${H.inn} ➔ ${H.out}（${H.nt} 晚）`],['房型',H.room],['地址',H.addr&&`<a href="${gq(q)}" target="_blank" rel="noopener">${H.addr}</a>`],
  ['電話',H.tel&&`<a href="tel:${H.tel.replace(/[^+\d]/g,'')}">${H.tel}</a>`],['付款',H.pay],['預訂來源',H.via]].filter(r=>r[1]);
 return `<details class="hc"${open?' open':''}><summary>🏨 <b>${H.s}</b>${open?'':'（連泊）'} <span class="badge">${H.inn}–${H.out}</span>${H.note?` <span class="badge">${H.note}</span>`:''}</summary><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl><a class="btn" target="_blank" rel="noopener" href="${gq(q)}">📍 在 Google 地圖開啟</a></details>`}

function renderFlexBox(i){
 const presets=FLEX_OPTIONS[i]||[];
 return `<details class="addbox">
  <summary><span>➕ 臨時增加行程 / 晴雨雪備案切換</span><span class="badge">可一鍵加入</span></summary>
  ${presets.length?`<div class="preset-group"><span class="preset-label">推薦彈性選項（依當日天氣或體力一鍵插入）：</span><div class="preset-list">`+
   presets.map((p,idx)=>`<div class="preset-item"><div><b>${p.cat}｜${p.icon} ${p.title} <small style="color:var(--mute);font-weight:400">(${p.time}${p.cost?` · 約${fmtY(p.cost)}`:''})</small></b><span>${p.desc}</span></div><button class="btn add" data-add-preset="${idx}">＋ 加入</button></div>`).join('')+
  `</div></div>`:''}
  <form class="custom-form" id="custom-form">
   <input type="text" name="time" placeholder="時間 (16:30)" required>
   <input type="text" name="title" placeholder="臨時景點或餐廳名稱" required>
   <input type="number" name="cost" placeholder="日圓預算 ¥" min="0" step="100">
   <div class="full">
    <input type="text" name="desc" placeholder="備註說明（選填，例如：伴手禮採買或雨天備案）">
    <button type="submit" class="btn main">新增</button>
   </div>
  </form>
 </details>`;
}

function day(i){
 const x=DAYS[i],c=COLORS[i];layer.clearLayers();
 const merged=getMergedStops(i);
 const pts=[...x.path];
 merged.forEach(item=>{if(item.isExtra&&item.stop.ll)pts.push(item.stop.ll)});
 L.polyline(x.path,{color:c,weight:4.5,opacity:.9}).addTo(layer);

 let n=0;const mk={};
 merged.forEach((item,k)=>{
  const s=item.stop;
  if(s.ll){
   n++;
   mk[k]=L.marker(s.ll,{icon:pin(item.isExtra?'★':n,c,item.isExtra?'ex':'')}).addTo(layer).bindPopup(`<b>${item.isExtra?'[臨時] ':''}${s.title}</b><br><small>${s.time}</small>`);
   pts.push(s.ll);
  }
 });
 const H=x.h!==undefined?HOTELS[x.h]:null;
 if(H){L.marker(H.ll,{icon:pin('宿',c,'h')}).addTo(layer).bindPopup(`<b>🏨 ${H.n}</b>`);pts.push(H.ll)}

 const daySum=getDayTotal(i);
 let nn=0;
 body.innerHTML=`<div class="dhead">
  <h2>Day 0${i+1}｜${x.d}<span class="sub">${x.t}</span></h2>
  <div style="text-align:right">
   ${x.jr==='自費'?'<span class="badge pay">自費交通</span>':`<span class="badge jr">JR Pass ${x.jr}</span>`}
   <div style="margin-top:4px"><span class="badge jr" id="day-sum-badge">💴 小計 ${fmtY(daySum)}</span></div>
  </div>
 </div>
 <div class="wx" id="wx-${i}">⏳ 正在載入 ${WEATHER_META[i].city} 即時氣候預報...</div>
 ${H?hotelCard(H,DAYS.findIndex(d=>d.h===x.h)===i):''}
 ${renderFoodChecklist(i)}
 ${renderFlexBox(i)}
 <div class="acts"><a class="btn main" target="_blank" rel="noopener" href="${dirUrl(pts)}">📍 Google 地圖路線導航</a><button class="btn" data-fit>🔍 回到當天全景</button><button class="btn" onclick="openPrintPreview(${i})">🖨️ 列印本日</button></div>
 <ol class="tl" style="--c:${c}">`+merged.map((item,k)=>{
  const s=item.stop;
  const key=item.isExtra?`ex-${i}-${item.exIdx}`:`${i}-${item.origIdx}`;
  const has=!!s.ll;if(has)nn++;
  return `<li class="st${done[key]?' done':''}${item.isExtra?' is-extra':''}" style="--c:${c}">
   <div class="time">${s.time}</div>
   <div class="tt"><span>${s.icon} ${has?`<span class="badge" style="background:${item.isExtra?'var(--terracotta)':c};color:#fff;border:0">${item.isExtra?'★':nn}</span> `:''}${s.title}</span> ${tag(s.type)} ${s.tagCost?`<span class="badge pay">${s.tagCost}</span>`:''}</div>
   ${s.desc?`<div class="desc">${s.desc}</div>`:''}
   ${s.warn?`<div class="warn">${s.warn}</div>`:''}
   ${s.opt&&!item.isExtra?`<div class="opt">💡 <b>優化建議：</b>${s.opt}</div>`:''}
   <div class="row">
    ${has?`<button class="btn" data-loc="${k}">📍 地圖定位</button>`:''}
    ${has||s.q?`<a class="btn" target="_blank" rel="noopener" href="${gm(s.ll,s.q)}">Google 地圖</a>`:''}
    <label class="cost-pill" title="可直接修改此項目預估或實際花費">💴 <input type="number" min="0" step="100" value="${s.cost}" data-cost-day="${i}" ${item.isExtra?`data-cost-ex="${item.exIdx}"`:`data-cost-orig="${item.origIdx}"`}> 円</label>
    <button class="btn" data-done="${key}">${done[key]?'↩ 取消完成':'✓ 完成'}</button>
    ${item.isExtra?`<button class="btn del" data-del-ex="${item.exIdx}">🗑️ 移除</button>`:''}
   </div>
  </li>`;
 }).join('')+`</ol>`;

 body._mk=mk;body._pts=pts;body._day=i;
 fit(pts);body.scrollTop=0;
 loadWeather(i);

 const form=document.getElementById('custom-form');
 if(form){
  form.onsubmit=e=>{
   e.preventDefault();
   const fd=new FormData(form);
   const title=(fd.get('title')||'').trim();
   if(!title)return;
   extra[i]=extra[i]||[];
   extra[i].push({
    time:(fd.get('time')||'').trim()||'彈性時段',
    icon:'📌',
    title,
    desc:(fd.get('desc')||'').trim(),
    type:'custom',
    q:title,
    cost:+(fd.get('cost')||0)
   });
   saveExtra();drawTabs();day(i);
  };
 }
}

// ---- 預覽列印功能 ----------------------------------------------------
let printScope='all';
const printOverlay=document.getElementById('print-overlay');
const printSheet=document.getElementById('print-sheet');
const btnPrintScope=document.getElementById('btn-print-scope');

function buildPrintSheet(scope){
 printScope=scope;
 const isAll=scope==='all';
 btnPrintScope.textContent=isAll
  ?(cur!=='all'?`📑 切換：僅列印 Day ${cur+1}`:'📑 目前：完整 7 日手冊')
  :'📑 切換：完整 7 日手冊';

 const targetIndices=isAll?[0,1,2,3,4,5,6]:[scope];
 const nowStr=new Date().toLocaleDateString('zh-TW');
 const B=getGrandBudget();

 let html=`<div class="ps-head">
  <div>
   <h2>❄️ 東北雪國 JR PASS 7天6夜行程手冊</h2>
   <div class="ps-meta">2027.01.09（六）– 01.15（五）｜JR 東日本周遊券 5 日券（Day 1–5）｜列印日期：${nowStr}</div>
  </div>
  <span class="badge">${isAll?'完整 7 日總覽與明細':`單日精簡版（Day 0${scope+1}）`}</span>
 </div>`;

 if(isAll){
  html+=`<div class="ps-summary">
   <div class="ps-box">
    <h4>💴 預算總覽（2人同行・不含機票）</h4>
    <ul>
     <li><b>預估總支出：${fmtY(B.total)}</b>（約 ${fmtTWD(B.total)}）</li>
     <li><b>6 晚住宿小計</b>：${fmtY(B.hotelSum)}</li>
     <li><b>JR EAST PASS 5日券</b>：${fmtY(B.passSum)}</li>
     <li><b>每日餐飲交通購物</b>：${fmtY(B.dailySum)}</li>
    </ul>
   </div>
   <div class="ps-box">
    <h4>🏨 住宿預訂一覽</h4>
    <ul>
     ${HOTELS.map(H=>`<li><b>${H.s}</b>（${H.inn}–${H.out}，${H.nt}晚）· ${fmtY(metaBudget[H.id])}<br><span style="color:var(--mute)">${H.addr||''}</span></li>`).join('')}
    </ul>
   </div>
  </div>
  <div class="ps-prep">
   <h4>📌 行前必做預約時間軸（2026/12 起）</h4>
   <ul>
    ${PREP_TASKS.map(p=>`<li>${prepDone[p.id]?'☑':'☐'} ${p.text}</li>`).join('')}
   </ul>
  </div>`;
 }

 targetIndices.forEach(i=>{
  const x=DAYS[i],c=COLORS[i],W=WEATHER_META[i];
  const H=x.h!==undefined?HOTELS[x.h]:null;
  const merged=getMergedStops(i);
  const dFoods=FOOD_SOUVENIRS.filter(f=>f.day===i);
  const dTotal=getDayTotal(i);

  html+=`<section class="ps-day">
   <div class="ps-day-hdr" style="--c:${c}">
    <h3>Day 0${i+1}｜${x.d} ${x.t}</h3>
    <div>
     <span class="badge jr" style="margin-right:4px">本日小計 ${fmtY(dTotal)}</span>
     ${x.jr==='自費'?'<span class="badge pay">自費交通</span>':`<span class="badge jr">JR Pass ${x.jr}</span>`}
    </div>
   </div>
   <div class="ps-wx">🌡️ <b>當地氣候參考（${W.city}）</b>：歷年均溫 ${W.avg}｜降雪機率：${W.snow}｜提示：${W.tip}</div>
   ${H?`<div class="ps-hotel">🏨 <b>住宿：${H.n}</b>（${H.inn} 入住 ➔ ${H.out} 退房）${H.addr?'｜地址：'+H.addr:''}${H.tel?'｜電話：'+H.tel:''}</div>`:''}
   ${dFoods.length?`<div class="ps-food">🎁 <b>本日伴手禮＆必吃美食：</b>${dFoods.map(f=>`${bought[f.id]?'☑':'☐'} ${f.name}（${f.where}，${f.price}）`).join('；')}</div>`:''}
   <table class="ps-table">
    <thead><tr><th>時間</th><th>行程與說明</th><th>票券／預算</th></tr></thead>
    <tbody>
     ${merged.map(item=>{
      const s=item.stop;
      const key=item.isExtra?`ex-${i}-${item.exIdx}`:`${i}-${item.origIdx}`;
      const isDone=!!done[key];
      return `<tr>
       <td class="col-time">${isDone?'☑':'☐'} ${s.time}</td>
       <td>
        <b>${s.icon} ${s.title}</b>
        ${s.desc?`<div style="color:var(--ink-soft);margin-top:2px">${s.desc}</div>`:''}
        ${s.warn?`<div class="ps-note">${s.warn}</div>`:''}
        ${s.opt&&!item.isExtra?`<div class="ps-opt">💡 ${s.opt}</div>`:''}
       </td>
       <td class="col-tag">
        ${tag(s.type)}
        ${s.cost>0?`<div style="font-size:12px;font-weight:700;color:var(--sage);margin-top:3px">${fmtY(s.cost)}</div>`:''}
        ${s.tagCost?`<div style="font-size:11px;color:var(--terracotta);margin-top:2px">${s.tagCost}</div>`:''}
       </td>
      </tr>`;
     }).join('')}
    </tbody>
   </table>
  </section>`;
 });

 printSheet.innerHTML=html;
}

window.openPrintPreview=function(scope='all'){
 buildPrintSheet(scope);
 printOverlay.classList.add('open');
 printOverlay.scrollTop=0;
};

document.getElementById('btn-print-preview').onclick=()=>openPrintPreview(cur==='all'?'all':cur);
document.getElementById('btn-close-print').onclick=()=>printOverlay.classList.remove('open');
document.getElementById('btn-do-print').onclick=()=>window.print();
btnPrintScope.onclick=()=>{
 if(printScope==='all'&&cur!=='all')buildPrintSheet(cur);
 else buildPrintSheet('all');
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&printOverlay.classList.contains('open'))printOverlay.classList.remove('open')});

// ---- 導覽與事件 ------------------------------------------------------
function go(i){cur=i;drawTabs();i==='all'?overview():day(i);
 if(innerWidth<=760)panel.classList.remove('hide')}

tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.i==='all'?'all':+b.dataset.i);b&&b.scrollIntoView({inline:'center',block:'nearest'})});

body.addEventListener('click',e=>{
 const t=e.target.closest('[data-i],[data-loc],[data-done],[data-fit],[data-add-preset],[data-del-ex]');if(!t)return;
 if(t.dataset.i!==undefined)go(+t.dataset.i);
 else if(t.dataset.fit!==undefined)fit(body._pts);
 else if(t.dataset.loc!==undefined){const m=body._mk[t.dataset.loc];if(m){map.flyTo(m.getLatLng(),14,{duration:.8});setTimeout(()=>m.openPopup(),700)}}
 else if(t.dataset.done){const k=t.dataset.done;done[k]=!done[k];saveDone();const y=body.scrollTop;day(body._day);body.scrollTop=y}
 else if(t.dataset.addPreset!==undefined){
  const dIdx=body._day,p=FLEX_OPTIONS[dIdx][+t.dataset.addPreset];
  if(p){
   extra[dIdx]=extra[dIdx]||[];
   extra[dIdx].push({...p});
   saveExtra();drawTabs();const y=body.scrollTop;day(dIdx);body.scrollTop=y;
  }
 }
 else if(t.dataset.delEx!==undefined){
  const dIdx=body._day,exIdx=+t.dataset.delEx;
  if(extra[dIdx]){
   extra[dIdx].splice(exIdx,1);
   delete done[`ex-${dIdx}-${exIdx}`];
   saveExtra();saveDone();drawTabs();const y=body.scrollTop;day(dIdx);body.scrollTop=y;
  }
 }
});

body.addEventListener('change',e=>{
 if(e.target.dataset.prep){
  const pid=e.target.dataset.prep;
  prepDone[pid]=e.target.checked;
  savePrep();
  const label=e.target.closest('.prep-item');
  if(label)label.classList.toggle('checked',e.target.checked);
 }
 if(e.target.dataset.food){
  const fid=e.target.dataset.food;
  bought[fid]=e.target.checked;
  saveBought();
  const label=e.target.closest('.food-item');
  if(label)label.classList.toggle('checked',e.target.checked);
  const box=e.target.closest('.food-box');
  if(box){
   const cbs=box.querySelectorAll('input[type=checkbox]');
   const checkedCnt=[...cbs].filter(c=>c.checked).length;
   const badge=box.querySelector('.badge.food');
   if(badge)badge.textContent=`${checkedCnt}/${cbs.length} 已完成`;
  }
 }
 if(e.target.dataset.costDay!==undefined){
  const dIdx=+e.target.dataset.costDay;
  const val=Math.max(0,+e.target.value||0);
  if(e.target.dataset.costOrig!==undefined){
   costs[`${dIdx}-${e.target.dataset.costOrig}`]=val;
   saveCosts();
  }else if(e.target.dataset.costEx!==undefined){
   const exIdx=+e.target.dataset.costEx;
   if(extra[dIdx]&&extra[dIdx][exIdx]){
    extra[dIdx][exIdx].cost=val;
    saveExtra();
   }
  }
  const badge=document.getElementById('day-sum-badge');
  if(badge)badge.textContent=`💴 小計 ${fmtY(getDayTotal(dIdx))}`;
 }
 if(e.target.dataset.mb){
  const k=e.target.dataset.mb;
  metaBudget[k]=Math.max(0,+e.target.value||0);
  saveMetaBudget();
  const B=getGrandBudget();
  const elG=document.getElementById('b-grand-jpy');if(elG)elG.textContent=fmtY(B.total);
  const elT=document.getElementById('b-grand-twd');if(elT)elT.textContent=`約 ${fmtTWD(B.total)}`;
  const elH=document.getElementById('b-hotel-jpy');if(elH)elH.textContent=fmtY(B.hotelSum);
  const elP=document.getElementById('b-pass-jpy');if(elP)elP.textContent=fmtY(B.passSum);
 }
});

document.getElementById('fab').onclick=()=>panel.classList.remove('hide');
document.querySelector('header').addEventListener('dblclick',()=>panel.classList.toggle('hide'));
if(innerWidth>760){
 const b=document.createElement('button');
 b.className='btn';b.textContent='⟨ 收合';
 b.onclick=()=>panel.classList.add('hide');
 document.getElementById('hdr-tools').appendChild(b);
}
go('all');
</script>
</body>
</html>
