 ['08:25–10:25','🛫','報到、行李托運、安檢與採買','長榮航空櫃檯辦理。'],

// ---- 地圖 ----------------------------------------------------------
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([38.5,140.5],7);
L.control.zoom({position:'bottomright'}).addTo(map);
const A='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const base={
 '標準':L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:A+' &copy; CARTO',subdomains:'abcd',maxZoom:19}),
 '街道':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:A,maxZoom:19}),
 '地形':L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:A+' &copy; OpenTopoMap',subdomains:'abc',maxZoom:17}),
 '衛星':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:18})
};
base['標準'].addTo(map);
const ctl=L.control.layers(base,null,{position:'topright',collapsed:true}).addTo(map);

// ---- Google 地圖底圖 -----------------------------------------------

const GMAPS_KEY='AIzaSyASpYtikL8QKyu2OLCgcm_c0cUBiLYb0rQ';
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
let gFailed=false;const gLayers=[];
function gFallback(why){if(gFailed)return;gFailed=true;console.warn('Google 地圖無法使用，已切回免金鑰底圖：',why);
 gLayers.forEach(l=>{try{ctl.removeLayer(l);map.removeLayer(l)}catch(e){}});if(!map.hasLayer(base['標準']))base['標準'].addTo(map)}
if(GMAPS_KEY){
 window.gm_authFailure=()=>gFallback('金鑰或 API 設定錯誤（請確認已啟用 Maps JavaScript API 並綁定帳單）');
 addEventListener('unhandledrejection',e=>{if(String(e.reason).includes('IntersectionObserver'))gFallback('Google 圖層初始化失敗')});
 window.initG=()=>loadScript('https://cdn.jsdelivr.net/npm/leaflet.gridlayer.googlemutant@0.14.1/dist/Leaflet.GoogleMutant.js').then(()=>{
  if(gFailed)return;
  const types={'Google 地圖':'roadmap','Google 衛星':'hybrid','Google 地形':'terrain'};
  for(const [n,t] of Object.entries(types)){const l=L.gridLayer.googleMutant({type:t,maxZoom:20});gLayers.push(l);ctl.addBaseLayer(l,n)}
  map.removeLayer(base['標準']);gLayers[0].addTo(map);
 }).catch(e=>gFallback(e));
 loadScript(`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&language=zh-TW&callback=initG`).catch(e=>gFallback(e));
}
const layer=L.layerGroup().addTo(map);

const pin=(n,c,h)=>L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-26],html:`<div class="pin${h?' h':''}" style="--c:${c}"><i>${n}</i></div>`});
const gm=(ll,q)=>ll?`https://www.google.com/maps/search/?api=1&query=${ll[0]},${ll[1]}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const dirUrl=p=>{const o=p[0],d=p[p.length-1],w=p.slice(1,-1).slice(0,8).map(x=>x.join(',')).join('|');
 return `https://www.google.com/maps/dir/?api=1&travelmode=transit&origin=${o}&destination=${d}${w?'&waypoints='+w:''}`};
const pad=()=>innerWidth<=760?{paddingTopLeft:[24,24],paddingBottomRight:[24,24]}:{paddingTopLeft:[510,40],paddingBottomRight:[60,40]};
function fit(pts){map.fitBounds(L.latLngBounds(pts),{...pad(),maxZoom:12})}

// ---- 狀態與繪製 ----------------------------------------------------
let cur='all',done={};
try{done=JSON.parse(localStorage.getItem('tohoku27')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('tohoku27',JSON.stringify(done))}catch(e){}};
const tabs=document.getElementById('tabs'),body=document.getElementById('body'),panel=document.getElementById('panel');
const tag=t=>t==='jr'?'<span class="badge jr">JR Pass 免費</span>':t==='pay'?'<span class="badge pay">自費</span>':'';

function drawTabs(){
 tabs.innerHTML=`<button class="tab" role="tab" data-i="all" aria-selected="${cur==='all'}">總覽</button>`+
 DAYS.map((x,i)=>`<button class="tab" role="tab" data-i="${i}" style="--c:${COLORS[i]}" aria-selected="${cur===i}">D${i+1}<small>${x.s}</small></button>`).join('');
}
function overview(){
 layer.clearLayers();const all=[];
 DAYS.forEach((x,i)=>{
  L.polyline(x.path,{color:COLORS[i],weight:4,opacity:.85,dashArray:i>4?'2 8':null}).addTo(layer).bindTooltip(`D${i+1} ${x.t}`);
  x.path.forEach(p=>all.push(p));
  const p=x.st.find(s=>s[5]&&s[5]!==x.path[0]);
  L.marker(x.path[Math.min(1,x.path.length-1)],{icon:pin(i+1,COLORS[i])}).addTo(layer).bindPopup(`<b>Day ${i+1}｜${x.d}</b><br>${x.t}`).on('click',()=>go(i));
 });
 body.innerHTML=`<h3 style="margin-top:2px">點選任一天，地圖會聚焦當天路線</h3>`+
 DAYS.map((x,i)=>`<button class="card" style="--c:${COLORS[i]}" data-i="${i}"><div class="dot">${i+1}</div><div><b>${x.d}｜${x.t}</b><span>${x.jr==='自費'?'自費交通':'JR Pass '+x.jr} ${x.h!==undefined?'· 🏨 '+HOTELS[x.h].s:''}</span></div></button>`).join('')+
 `<h3>🏨 住宿一覽</h3>${HOTELS.map(H=>{const k=DAYS.findIndex(d=>d.h===HOTELS.indexOf(H));return `<button class="card" style="--c:${COLORS[k]}" data-i="${k}"><div class="dot">🏨</div><div><b>${H.s}</b><span>${H.inn} 入住 ➔ ${H.out} 退房（${H.nt} 晚）</span></div></button>`}).join('')}<h3>🎫 JR Pass 涵蓋（Day 1–5）</h3><ul class="p"><li>東京單軌電車（羽田 ➔ 濱松町）</li><li>東北新幹線（東京 ➔ 盛岡、盛岡 ➔ 仙台）</li><li>秋田新幹線（東京 ➔ 秋田、秋田 ➔ 角館 ➔ 盛岡）</li><li>JR 仙山線（仙台 ➔ 山形）</li><li>北陸新幹線（大宮 ➔ 輕井澤 ➔ 東京）</li><li>山形新幹線（山形 ➔ 大石田、山形 ➔ 大宮）</li><li>JR 都內路線（山手線、總武線等）</li></ul>
 <h3>💴 需另行自費</h3><ul class="p"><li>山形 ➔ 藏王溫泉巴士（單程約 ¥1,200）、藏王纜車票</li><li>大石田 ⇄ 銀山溫泉計程車（建議預約）</li><li>Day 6–7 東京地鐵與羽田交通</li></ul>
 <h3>🔗 實用連結</h3><div class="links"><a class="btn" target="_blank" rel="noopener" href="https://www.eki-net.com/">JR Eki-Net 劃位</a><a class="btn" target="_blank" rel="noopener" href="https://tenki.jp/forecast/2/">東北天氣</a><a class="btn" target="_blank" rel="noopener" href="https://zaoropeway.co.jp/livecam/">藏王 LiveCam</a><a class="btn" target="_blank" rel="noopener" href="https://tokyo-haneda.com/zh-TW/">羽田航班</a><a class="btn" target="_blank" rel="noopener" href="https://www.tokyo-monorail.co.jp/tc/">東京單軌電車</a></div>`;
 fit(all);
}
const gq=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
function hotelCard(H,open){
 const q=H.q||(H.addr?H.n.split(' ').pop()+' '+H.addr:H.n),rows=[
  ['入住 / 退房',`${H.inn} ➔ ${H.out}（${H.nt} 晚）`],['房型',H.room],['地址',H.addr&&`<a href="${gq(q)}" target="_blank" rel="noopener">${H.addr}</a>`],
  ['電話',H.tel&&`<a href="tel:${H.tel.replace(/[^+\d]/g,'')}">${H.tel}</a>`],['付款',H.pay],['預訂來源',H.via]].filter(r=>r[1]);
 return `<details class="hc"${open?' open':''}><summary>🏨 <b>${H.s}</b>${open?'':'（連泊）'} <span class="badge">${H.inn}–${H.out}</span>${H.note?` <span class="badge">${H.note}</span>`:''}</summary><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl><a class="btn" target="_blank" rel="noopener" href="${gq(q)}">📍 在 Google 地圖開啟</a></details>`}
function day(i){
 const x=DAYS[i],c=COLORS[i];layer.clearLayers();
 L.polyline(x.path,{color:c,weight:5,opacity:.9}).addTo(layer);
 const pts=[...x.path];let n=0;const mk={};
 x.st.forEach((s,k)=>{if(s[5]){n++;mk[k]=L.marker(s[5],{icon:pin(n,c)}).addTo(layer).bindPopup(`<b>${s[2]}</b><br><small>${s[0]}</small>`);pts.push(s[5])}});
 const H=x.h!==undefined?HOTELS[x.h]:null;if(H){L.marker(H.ll,{icon:pin('🏨',c,1)}).addTo(layer).bindPopup(`<b>🏨 ${H.n}</b>`);pts.push(H.ll)}
 let nn=0;
 body.innerHTML=`<div class="dhead"><h2>Day ${i+1}｜${x.d}<br><span style="font-weight:500;font-size:15px">${x.t}</span></h2>${x.jr==='自費'?'<span class="badge pay">自費交通</span>':`<span class="badge jr">JR Pass ${x.jr}</span>`}</div>
 ${H?hotelCard(H,DAYS.findIndex(d=>d.h===x.h)===i):''}
 <div class="acts"><a class="btn main" target="_blank" rel="noopener" href="${dirUrl(x.path)}">📍 Google 地圖導航</a><button class="btn" data-fit>🔍 回到當天全景</button></div>
 <ol class="tl" style="--c:${c}">`+x.st.map((s,k)=>{const key=`${i}-${k}`,has=!!s[5];if(has)nn++;
  return `<li class="st${done[key]?' done':''}" style="--c:${c}"><div class="time">${s[0]}</div>
  <div class="tt"><span>${s[1]} ${has?`<span class="badge" style="background:${c};color:#fff">${nn}</span> `:''}${s[2]}</span> ${tag(s[4])} ${s[8]?`<span class="badge pay">${s[8]}</span>`:''}</div>
  ${s[3]?`<div class="desc">${s[3]}</div>`:''}${s[7]?`<div class="warn">${s[7]}</div>`:''}
  <div class="row">${has?`<button class="btn" data-loc="${k}">📍 地圖定位</button>`:''}${has||s[6]?`<a class="btn" target="_blank" rel="noopener" href="${gm(s[5],s[6])}">Google 地圖</a>`:''}<button class="btn" data-done="${key}">${done[key]?'↩ 取消完成':'✓ 完成'}</button></div></li>`}).join('')+`</ol>`;
 body._mk=mk;body._pts=pts;body._day=i;
 fit(pts);body.scrollTop=0;
}
function go(i){cur=i;drawTabs();i==='all'?overview():day(i);
 if(innerWidth<=760)panel.classList.remove('hide')}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.i==='all'?'all':+b.dataset.i);b&&b.scrollIntoView({inline:'center',block:'nearest'})});
body.addEventListener('click',e=>{
 const t=e.target.closest('[data-i],[data-loc],[data-done],[data-fit]');if(!t)return;
 if(t.dataset.i!==undefined)go(+t.dataset.i);
 else if(t.dataset.fit!==undefined)fit(body._pts);
 else if(t.dataset.loc!==undefined){const m=body._mk[t.dataset.loc];map.flyTo(m.getLatLng(),13,{duration:.8});setTimeout(()=>m.openPopup(),700)}
 else if(t.dataset.done){const k=t.dataset.done;done[k]=!done[k];save();const y=body.scrollTop;day(body._day);body.scrollTop=y}
});
document.getElementById('fab').onclick=()=>panel.classList.remove('hide');
document.querySelector('header').addEventListener('dblclick',()=>panel.classList.toggle('hide'));
if(innerWidth>760){const b=document.createElement('button');b.className='btn';b.textContent='⟨ 收合';b.style.cssText='position:absolute;right:14px;top:14px';b.onclick=()=>panel.classList.add('hide');document.querySelector('header').appendChild(b)}
go('all');
</script>
