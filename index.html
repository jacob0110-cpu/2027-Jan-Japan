<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東北雪國 JR PASS 7天6夜行程</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#14233a;--mute:#5d6b80;--snow:rgba(250,252,255,.94);--line:#dde5f0;--ice:#2f7fd1;--lamp:#e8912d;--ok:#1f9d63;--pay:#c2410c;--sky:#eef6ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.6 "Noto Sans TC",system-ui,sans-serif;color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0;background:#dfe9f3}
.panel{position:fixed;z-index:500;left:16px;top:16px;bottom:16px;width:min(500px,calc(100vw - 32px));display:flex;flex-direction:column;background:var(--snow);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 12px 40px rgba(20,35,58,.28);overflow:hidden;transition:transform .3s}
.panel.hide{transform:translateX(calc(-100% - 24px))}
header{padding:18px 20px 10px;position:relative}
.hdr-tools{position:absolute;right:14px;top:14px;display:flex;gap:6px}
h1{font:900 22px/1.25 "Noto Serif TC",serif;margin:0 0 4px;letter-spacing:.02em;padding-right:135px}
.meta{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.tabs{display:flex;gap:6px;padding:6px 14px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tab small{color:var(--mute);margin-left:4px}
.tab[aria-selected=true]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.tab[aria-selected=true] small{color:#ffffffcc}
.tab:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.body{flex:1;overflow-y:auto;padding:14px 18px 28px;scroll-behavior:smooth}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.dhead h2{font:900 18px/1.35 "Noto Serif TC",serif;margin:0}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:#e8f1fc;color:#1b5fa8;white-space:nowrap}
.badge.pay{background:#fdeee3;color:var(--pay)}.badge.jr{background:#e1f5ea;color:#17784b}.badge.custom{background:#f3e8ff;color:#6b21a8}.badge.food{background:#fef3c7;color:#92400e}

/* 即時氣候卡片 */
.wx{background:linear-gradient(135deg,#eef6ff 0%,#f7fbff 100%);border:1px solid #cfe2f7;border-radius:12px;padding:10px 13px;margin:8px 0 12px;font-size:13px}
.wx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wx-main{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#12345b}
.wx-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#fff;border:1px solid #cfe2f7;color:#2563eb}
.wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #cfe2f7}
.wx-cell{background:rgba(255,255,255,.75);border-radius:8px;padding:5px 8px}
.wx-cell small{display:block;color:var(--mute);font-size:11px}
.wx-cell b{font-size:13px;color:var(--ink)}
.wx-tip{margin-top:7px;color:#334e68;font-size:12.5px}

/* 預算統計儀表板 */
.budget-card{background:linear-gradient(135deg,#f0fdf4 0%,#f8fafc 100%);border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;margin:8px 0 14px;font-size:13.5px}
.budget-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.budget-total{font-size:18px;font-weight:900;color:#14532d;font-variant-numeric:tabular-nums}
.budget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.b-cell{background:#fff;border:1px solid #dcfce7;border-radius:8px;padding:6px 8px}
.b-cell small{display:block;font-size:11px;color:var(--mute)}
.b-cell b{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.budget-details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:#166534;margin-top:4px}
.budget-edit-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #bbf7d0}
.b-edit-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.b-edit-row label{flex:1;color:#334155}
.b-edit-row input{width:105px;border:1px solid #cbd5e1;border-radius:6px;padding:3px 7px;font:inherit;font-size:12.5px;text-align:right;background:#fff}

/* 伴手禮與美食卡片 */
.food-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:9px 12px;margin:8px 0 12px;font-size:13.5px}
.food-box summary{cursor:pointer;font-weight:700;color:#78350f;display:flex;align-items:center;justify-content:space-between}
.food-list{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.food-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border:1px solid #fef3c7;border-radius:8px;padding:7px 9px}
.food-item input[type=checkbox]{margin-top:3px;accent-color:#d97706;width:15px;height:15px;cursor:pointer;flex:none}
.food-item.checked b{text-decoration:line-through;color:var(--mute)}
.food-item div{flex:1;min-width:0}
.food-item b{display:block;font-size:13px;color:#451a03}
.food-item span{display:block;font-size:12px;color:#78350f}
.food-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.food-link{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:2px 8px;border-radius:6px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;text-decoration:none;font-weight:500}
.food-link:hover{background:#fef3c7;border-color:#f59e0b}

/* 住宿卡片 */
.hc{background:#fff7ea;border:1px solid #f4dcb4;border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:14px}
.hc summary{cursor:pointer;font-weight:500}.hc dl{display:grid;grid-template-columns:4.8em 1fr;gap:4px 10px;margin:10px 0 6px}.hc dt{color:var(--mute)}.hc dd{margin:0;word-break:break-word}

/* 臨時增加行程區塊 */
.addbox{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:8px 0 14px;font-size:13.5px}
.addbox summary{cursor:pointer;font-weight:700;color:#1e3a5f;display:flex;align-items:center;justify-content:space-between}
.preset-group{margin-top:10px}
.preset-label{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:5px;display:block}
.preset-list{display:flex;flex-direction:column;gap:6px}
.preset-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.preset-item div{flex:1;min-width:0}
.preset-item b{display:block;font-size:13px}
.preset-item span{display:block;font-size:12px;color:var(--mute)}
.custom-form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:88px 1fr 92px;gap:6px}
.custom-form input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px;background:#fff;width:100%}
.custom-form .full{grid-column:1/-1;display:flex;gap:6px}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--ice);color:var(--ice)}
.btn.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.main:hover{opacity:.9;color:#fff}
.btn.add{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;font-weight:500;white-space:nowrap}
.btn.add:hover{background:#dbeafe}
.btn.del{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.btn.del:hover{background:#fee2e2}

ol.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--c)}
.st{position:relative;padding:0 0 16px 18px}
.st::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--c)}
.st.done::before{background:var(--c)}
.st.done .tt{text-decoration:line-through;color:var(--mute)}
.st.is-extra{background:rgba(243,232,255,.35);border-radius:10px;padding:8px 10px 12px 18px;margin-bottom:10px}
.time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tt{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.desc{color:#34445c;font-size:14px;margin:2px 0}
.warn{font-size:13px;background:#fff4f0;border-left:3px solid var(--pay);padding:5px 10px;border-radius:0 6px 6px 0;margin:5px 0}
.opt{font-size:12.5px;background:#f0fdf4;border-left:3px solid var(--ok);padding:4px 10px;border-radius:0 6px 6px 0;margin:5px 0;color:#165b38}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row .btn{padding:2px 9px;font-size:12px}
.cost-pill{display:inline-flex;align-items:center;gap:3px;background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-size:12px;color:#334155}
.cost-pill input{width:64px;border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;color:#14532d;text-align:right;font-variant-numeric:tabular-nums}
.cost-pill input:focus{outline:none;background:#fff}

.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--c)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.card b{display:block}.card span{color:var(--mute);font-size:13px}
h3{font:700 15px "Noto Sans TC";margin:20px 0 6px}
ul.p{margin:0;padding-left:20px;font-size:14px}
ul.p li{margin-bottom:4px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;z-index:600;left:16px;top:16px;display:none;background:var(--snow);border:1px solid #fff;border-radius:12px;padding:8px 14px;font:inherit;box-shadow:0 6px 20px rgba(20,35,58,.25);cursor:pointer}
.panel.hide~.fab{display:block}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center}
.pin i{transform:rotate(45deg);font:700 12px/1 "Noto Sans TC";color:#fff;font-style:normal}
.pin.h{background:var(--lamp)}
.pin.ex{background:#7e22ce}
.leaflet-control-layers{border-radius:10px!important;border:0!important;box-shadow:0 4px 16px rgba(0,0,0,.25)!important}
.leaflet-popup-content{font:14px/1.5 "Noto Sans TC",sans-serif;margin:10px 14px}

/* ---- 預覽列印覆蓋層樣式 ---- */
.print-overlay{position:fixed;inset:0;z-index:900;background:#eef2f7;overflow-y:auto;display:none;padding:68px 16px 40px}
.print-overlay.open{display:block}
.print-bar{position:fixed;top:0;left:0;right:0;z-index:910;background:#14233a;color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.print-bar-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.print-bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.print-sheet{max-width:820px;margin:0 auto;background:#fff;border-radius:12px;padding:32px 38px;box-shadow:0 8px 30px rgba(20,35,58,.12);color:var(--ink)}
.ps-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ps-head h2{font:900 24px/1.25 "Noto Serif TC",serif;margin:0}
.ps-meta{font-size:13px;color:var(--mute);margin-top:4px}
.ps-summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.ps-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fafcff}
.ps-box h4{margin:0 0 8px;font-size:14px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px}
.ps-box ul{margin:0;padding-left:18px;font-size:13px}
.ps-box li{margin-bottom:4px}
.ps-day{margin-bottom:26px;break-inside:avoid}
.ps-day-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:#f1f5f9;border-left:5px solid var(--c);margin-bottom:10px}
.ps-day-hdr h3{margin:0;font:900 16px/1.3 "Noto Serif TC",serif}
.ps-wx{font-size:12.5px;color:#1e40af;background:#eff6ff;border:1px solid #dbeafe;border-radius:7px;padding:6px 10px;margin-bottom:8px}
.ps-hotel{font-size:13px;background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:7px 11px;margin-bottom:8px}
.ps-food{font-size:12.5px;background:#fefce8;border:1px solid #fef08a;border-radius:7px;padding:6px 10px;margin-bottom:10px;color:#713f12}
.ps-table{width:100%;border-collapse:collapse;font-size:13.5px}
.ps-table th,.ps-table td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.ps-table th{background:#f8fafc;font-weight:700;color:var(--mute);font-size:12px}
.ps-table td.col-time{width:115px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute);font-weight:500}
.ps-table td.col-tag{width:96px;text-align:center}
.ps-note{font-size:12px;color:var(--pay);margin-top:3px}
.ps-opt{font-size:12px;color:#166534;margin-top:3px}

@media (max-width:760px){
 #map{bottom:auto;height:40vh}
 .panel{left:0;right:0;top:calc(40vh - 14px);bottom:0;width:auto;border-radius:18px 18px 0 0}
 .panel.hide{transform:translateY(calc(100% - 52px))}
 .fab{display:none!important}
 h1{font-size:18px;padding-right:125px}
 .leaflet-control-layers{margin-top:8px!important}
 .print-sheet{padding:20px 16px}
 .ps-summary{grid-template-columns:1fr}
 .custom-form{grid-template-columns:1fr 1fr}
}

@media print{
 html,body{height:auto!important;overflow:visible!important;background:#fff!important}
 #map,.panel,.fab,.print-bar{display:none!important}
 .print-overlay{position:static!important;display:block!important;padding:0!important;background:#fff!important;overflow:visible!important}
 .print-sheet{max-width:100%!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
 .ps-day{page-break-inside:avoid;break-inside:avoid}
 .badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

</div>

   .then(()=>{

}

   </div>

  }else{

}

function day(i){

 merged.forEach((item,k)=>{
  const s=item.stop;

   n++;
   mk[k]=L.marker(s.ll,{icon:pin(item.isExtra?'★':n,c,item.isExtra?'ex':'')}).addTo(layer).bindPopup(`<b>${item.isExtra?'[臨時] ':''}${s.title}</b><br><small>${s.time}</small>`);
   pts.push(s.ll);

   <div class="ps-wx">🌡️ <b>當地氣候參考（${W.city}）</b>：歷年均溫 ${W.avg}｜降雪機率：${W.snow}｜提示：${W.tip}</div>
   ${H?`<div class="ps-hotel">🏨 <b>住宿：${H.n}</b>（${H.inn} 入住 ➔ ${H.out} 退房）${H.addr?'｜地址：'+H.addr:''}${H.tel?'｜電話：'+H.tel:''}</div>`:''}
   ${dFoods.length?`<div class="ps-food">🎁 <b>本日伴手禮＆必吃美食：</b>${dFoods.map(f=>`${bought[f.id]?'☑':'☐'} ${f.name}（${f.where}，${f.price}）`).join('；')}</div>`:''}
   <table class="ps-table">
    <thead><tr><th>時間</th><th>行程與說明</th><th>票券／預算</th></tr></thead>
    <tbody>
     ${merged.map(item=>{
      const s=item.stop;
      const key=item.isExtra?`ex-${i}-${item.exIdx}`:`${i}-${item.origIdx}`;
      const isDone=!!done[key];
      return `<tr>
       <td class="col-time">${isDone?'☑':'☐'} ${s.time}</td>
       <td>
        <b>${s.icon} ${s.title}</b>
        ${s.desc?`<div style="color:#34445c;margin-top:2px">${s.desc}</div>`:''}
        ${s.warn?`<div class="ps-note">${s.warn}</div>`:''}
        ${s.opt&&!item.isExtra?`<div class="ps-opt">💡 ${s.opt}</div>`:''}
       </td>
       <td class="col-tag">
        ${tag(s.type)}
        ${s.cost>0?`<div style="font-size:12px;font-weight:700;color:#14532d;margin-top:3px">${fmtY(s.cost)}</div>`:''}
        ${s.tagCost?`<div style="font-size:11px;color:var(--pay);margin-top:2px">${s.tagCost}</div>`:''}
       </td>
      </tr>`;
     }).join('')}
    </tbody>
   </table>
  </section>`;
 });

 printSheet.innerHTML=html;
}

window.openPrintPreview=function(scope='all'){
 buildPrintSheet(scope);
 printOverlay.classList.add('open');
 printOverlay.scrollTop=0;
};

document.getElementById('btn-print-preview').onclick=()=>openPrintPreview(cur==='all'?'all':cur);
document.getElementById('btn-close-print').onclick=()=>printOverlay.classList.remove('open');
document.getElementById('btn-do-print').onclick=()=>window.print();
btnPrintScope.onclick=()=>{
 if(printScope==='all'&&cur!=='all')buildPrintSheet(cur);
 else buildPrintSheet('all');
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&printOverlay.classList.contains('open'))printOverlay.classList.remove('open')});

// ---- 導覽與事件 ------------------------------------------------------
function go(i){cur=i;drawTabs();i==='all'?overview():day(i);
 if(innerWidth<=760)panel.classList.remove('hide')}

tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.i==='all'?'all':+b.dataset.i);b&&b.scrollIntoView({inline:'center',block:'nearest'})});

body.addEventListener('click',e=>{
 const t=e.target.closest('[data-i],[data-loc],[data-done],[data-fit],[data-add-preset],[data-del-ex]');if(!t)return;
 if(t.dataset.i!==undefined)go(+t.dataset.i);
 else if(t.dataset.fit!==undefined)fit(body._pts);
 else if(t.dataset.loc!==undefined){const m=body._mk[t.dataset.loc];if(m){map.flyTo(m.getLatLng(),14,{duration:.8});setTimeout(()=>m.openPopup(),700)}}
 else if(t.dataset.done){const k=t.dataset.done;done[k]=!done[k];saveDone();const y=body.scrollTop;day(body._day);body.scrollTop=y}
 else if(t.dataset.addPreset!==undefined){
  const dIdx=body._day,p=FLEX_OPTIONS[dIdx][+t.dataset.addPreset];
  if(p){
   extra[dIdx]=extra[dIdx]||[];
   extra[dIdx].push({...p});
   saveExtra();drawTabs();const y=body.scrollTop;day(dIdx);body.scrollTop=y;
  }
 }
 else if(t.dataset.delEx!==undefined){
  const dIdx=body._day,exIdx=+t.dataset.delEx;
  if(extra[dIdx]){
   extra[dIdx].splice(exIdx,1);
   delete done[`ex-${dIdx}-${exIdx}`];
   saveExtra();saveDone();drawTabs();const y=body.scrollTop;day(dIdx);body.scrollTop=y;
  }
 }
});

body.addEventListener('change',e=>{
 if(e.target.dataset.food){
  const fid=e.target.dataset.food;
  bought[fid]=e.target.checked;
  saveBought();
  const label=e.target.closest('.food-item');
  if(label)label.classList.toggle('checked',e.target.checked);
  const box=e.target.closest('.food-box');
  if(box){
   const cbs=box.querySelectorAll('input[type=checkbox]');
   const checkedCnt=[...cbs].filter(c=>c.checked).length;
   const badge=box.querySelector('.badge.food');
   if(badge)badge.textContent=`${checkedCnt}/${cbs.length} 已完成`;
  }
 }
 if(e.target.dataset.costDay!==undefined){
  const dIdx=+e.target.dataset.costDay;
  const val=Math.max(0,+e.target.value||0);
  if(e.target.dataset.costOrig!==undefined){
   costs[`${dIdx}-${e.target.dataset.costOrig}`]=val;
   saveCosts();
  }else if(e.target.dataset.costEx!==undefined){
   const exIdx=+e.target.dataset.costEx;
   if(extra[dIdx]&&extra[dIdx][exIdx]){
    extra[dIdx][exIdx].cost=val;
    saveExtra();
   }
  }
  const badge=document.getElementById('day-sum-badge');
  if(badge)badge.textContent=`💴 本日小計 ${fmtY(getDayTotal(dIdx))}`;
 }
 if(e.target.dataset.mb){
  const k=e.target.dataset.mb;
  metaBudget[k]=Math.max(0,+e.target.value||0);
  saveMetaBudget();
  const B=getGrandBudget();
  const elG=document.getElementById('b-grand-jpy');if(elG)elG.textContent=fmtY(B.total);
  const elT=document.getElementById('b-grand-twd');if(elT)elT.textContent=`約 ${fmtTWD(B.total)}`;
  const elH=document.getElementById('b-hotel-jpy');if(elH)elH.textContent=fmtY(B.hotelSum);
  const elP=document.getElementById('b-pass-jpy');if(elP)elP.textContent=fmtY(B.passSum);
 }
});

document.getElementById('fab').onclick=()=>panel.classList.remove('hide');
document.querySelector('header').addEventListener('dblclick',()=>panel.classList.toggle('hide'));
if(innerWidth>760){
 const b=document.createElement('button');
 b.className='btn';b.textContent='⟨ 收合';
 b.onclick=()=>panel.classList.add('hide');
 document.getElementById('hdr-tools').appendChild(b);
}
go('all');
</script>
</body>
</html>
